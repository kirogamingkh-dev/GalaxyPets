name: Build GalaxyPets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload GalaxyPets.jar
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyPets
          path: target/GalaxyPets.jar
